name: CI E2E (Local Backend)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-test:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: GuestFlow.Frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: GuestFlow.Frontend
        run: npx playwright install --with-deps chromium

      - name: Build Solution
        run: dotnet build GuestFlow.sln

      - name: Run Backend API
        run: |
          dotnet run --project GuestFlow.Api/GuestFlow.Api.csproj --no-build &
          echo "Waiting for API to start..."
          # Wait up to 60s for readiness
          for i in {1..60}; do
            if curl -s http://localhost:5146/health/ready; then
              echo "API is ready!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 1
          done
        env:
          ASPNETCORE_URLS: "http://localhost:5146"
          ASPNETCORE_ENVIRONMENT: "Development"
          DatabaseProvider: "Sqlite"
          ConnectionStrings__DefaultConnection: "Data Source=GuestFlow_CI.db"
          SeedDemoData: "true"
          # Standardized demo credentials
          JWT__SecretKey: "ThisIsASecretKeyForTestingPurposesOnly123!4567890"
          JWT__Issuer: "GuestFlowApp"
          JWT__Audience: "http://localhost"
          # Disable background services that might check external systems
          PMS__Enabled: "false"

      - name: Run Playwright Tests
        working-directory: GuestFlow.Frontend
        env:
          CI: "true"
          E2E_REAL_BACKEND: "true"
          E2E_USE_WEB_SERVER: "true"
          # Credentials matching DatabaseSeeder (Default Demo Admin)
          E2E_USER_EMAIL: "demo.admin.demo.admin@guestflow.local"
          E2E_USER_PASSWORD: "GuestFlow123!"
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: GuestFlow.Frontend/playwright-report
          retention-days: 14
