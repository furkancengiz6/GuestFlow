name: Staging E2E (Playwright real backend)

on:
  workflow_dispatch:
    inputs:
      invoice_id:
        description: "Optional: invoice id to use for journal flow (E2E_INVOICE_ID). Leave empty to auto-pick."
        required: false
        default: ""

jobs:
  staging-e2e:
    name: Staging E2E smoke (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GuestFlow.Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke (real backend)
        env:
          CI: "true"
          E2E_REAL_BACKEND: "true"
          E2E_USE_WEB_SERVER: "false"
          E2E_BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          E2E_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.STAGING_E2E_USER_PASSWORD }}
          E2E_INVOICE_ID: ${{ inputs.invoice_id }}
          PLAYWRIGHT_STORAGE: "tests/staging-storageState.json"
          E2E_FORCE_UI_LOGIN: "true"
        run: npm run test:e2e:staging

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report
          path: GuestFlow.Frontend/playwright-report

