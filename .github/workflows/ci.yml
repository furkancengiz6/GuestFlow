name: CI

on:
  push:
    # Run on all branches
  pull_request:

jobs:
  backend:
    name: Backend (.NET) build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GuestFlow.sln

      - name: Fail on vulnerable NuGet packages
        run: |
          set -euo pipefail
          dotnet list GuestFlow.Api/GuestFlow.Api.csproj package --vulnerable | tee vulnerable.txt
          if grep -q ">" vulnerable.txt; then
            echo "Vulnerable packages detected. Please upgrade them before merging."
            exit 1
          fi

      - name: Build
        run: dotnet build GuestFlow.sln -c Release --no-restore

      - name: Test
        env:
          # Test-only secret (NOT a production secret); the app requires a minimum length.
          JWT__SecretKey: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          RateLimitSettings__Enabled: "false"
        run: dotnet test GuestFlow.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/*.trx"

  frontend-e2e-smoke:
    name: Frontend (Playwright) smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GuestFlow.Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Seed Playwright storageState (mocked auth)
        run: npm run seed:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (chromium)
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:5173"
          E2E_USER_EMAIL: "smoke@guestflow.local"
          E2E_USER_PASSWORD: "Admin123!"
          PLAYWRIGHT_STORAGE: "tests/storageState.json"
        run: npx playwright test tests/smoke --project=chromium

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: GuestFlow.Frontend/playwright-report

  frontend-unit:
    name: Frontend (Jest) unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GuestFlow.Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run unit tests (CI)
        env:
          CI: "true"
        run: npm run test:ci
