groups:
  - name: guestflow_alerts
    rules:
      # API Health Alerts
      - alert: GuestFlowAPIDown
        expr: up{job="guestflow-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "GuestFlow API is down"
          description: "GuestFlow API has been down for more than 1 minute."

      - alert: GuestFlowAPIHighErrorRate
        expr: rate(http_requests_total{job="guestflow-api", status=~"5.."}[5m]) / rate(http_requests_total{job="guestflow-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High error rate on GuestFlow API"
          description: "Error rate is {{ $value | printf "%.2f" }}% over the last 5 minutes."

      # Performance Alerts
      - alert: GuestFlowAPIHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="guestflow-api"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High response time on GuestFlow API"
          description: "95th percentile response time is {{ $value }}s over the last 5 minutes."

      - alert: GuestFlowAPIHighCPUUsage
        expr: rate(process_cpu_user_seconds_total{job="guestflow-api"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High CPU usage on GuestFlow API"
          description: "CPU usage is {{ $value | printf "%.2f" }} over the last 5 minutes."

      # Database Alerts
      - alert: SQLServerDown
        expr: up{job="sqlserver"} == 0
        for: 2m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "SQL Server is down"
          description: "SQL Server has been down for more than 2 minutes."

      - alert: SQLServerHighConnections
        expr: sqlserver_connections_total > 100
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High number of SQL Server connections"
          description: "SQL Server has {{ $value }} active connections."

      # Cache Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: cache
        annotations:
          summary: "Redis cache is down"
          description: "Redis has been down for more than 2 minutes."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value | printf "%.1f" }}%."

      # System Alerts
      - alert: HighSystemCPUUsage
        expr: rate(node_cpu_seconds_total{mode!="idle"}[5m]) > 0.85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High system CPU usage"
          description: "System CPU usage is {{ $value | printf "%.1f" }}%."

      - alert: LowSystemMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Low system memory"
          description: "System memory usage is {{ $value | printf "%.1f" }}%."

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value | printf "%.1f" }}%."

      # Container Alerts
      - alert: ContainerRestarted
        expr: increase(container_last_seen{container_label_com_docker_compose_service!=""}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} has restarted."

      # Business Logic Alerts
      - alert: LowActiveGuests
        expr: guestflow_active_guests < 5
        for: 10m
        labels:
          severity: info
          service: business
        annotations:
          summary: "Low number of active guests"
          description: "Only {{ $value }} active guests in the system."

      - alert: HighFailedPayments
        expr: rate(guestflow_payment_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | printf "%.2f" }} over the last 5 minutes."