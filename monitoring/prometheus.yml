global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'guestflow-api'
    static_configs:
      - targets: ['guestflow-api:5000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'guestflow-frontend'
    static_configs:
      - targets: ['guestflow-frontend:80']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'sqlserver'
    static_configs:
      - targets: ['sqlserver:1433']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
