version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5146/api/v1.0}
        VITE_ENV: ${VITE_ENV:-production}
        VITE_APP_NAME: ${VITE_APP_NAME:-GuestFlow}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    container_name: guestflow-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5146/api/v1.0}
    networks:
      - guestflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  guestflow-network:
    external: true

