name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18.x'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: GuestFlow.Frontend
        run: npm ci

      - name: Run ESLint
        working-directory: GuestFlow.Frontend
        run: npm run lint

      - name: Type check
        working-directory: GuestFlow.Frontend
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: GuestFlow.Frontend
        run: npm ci

      - name: Run tests
        working-directory: GuestFlow.Frontend
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./GuestFlow.Frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: GuestFlow.Frontend
        run: npm ci

      - name: Create .env file
        working-directory: GuestFlow.Frontend
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'http://localhost:5146/api/v1.0' }}" >> .env
          echo "VITE_ENV=production" >> .env
          echo "VITE_APP_NAME=GuestFlow" >> .env
          echo "VITE_APP_VERSION=${{ github.sha }}" >> .env

      - name: Build application
        working-directory: GuestFlow.Frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: GuestFlow.Frontend/dist
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GuestFlow.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: GuestFlow.Frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: GuestFlow.Frontend
        run: npx playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: GuestFlow.Frontend/dist

      - name: Start preview server
        working-directory: GuestFlow.Frontend
        run: npm run preview &
        env:
          PORT: 4173

      - name: Wait for server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:4173; do sleep 1; done'

      - name: Run E2E tests
        working-directory: GuestFlow.Frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: GuestFlow.Frontend/playwright-report
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: GuestFlow.Frontend/dist

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'GuestFlow.Frontend'
          output_location: 'dist'
          skip_app_build: true

      - name: Deploy to AWS S3
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync GuestFlow.Frontend/dist s3://$S3_BUCKET --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Deploy to FTP
        if: env.FTP_HOST != ''
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          cd GuestFlow.Frontend
          chmod +x scripts/deploy-ftp.sh
          ./scripts/deploy-ftp.sh
